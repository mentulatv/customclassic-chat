# The bot's token goes in bot/.env as DISCORD_BOT_TOKEN=... (never committed).
# The bot runs as uid 1000: before the first start, mkdir data && chown 1000:1000 data
services:
  ccchat-bot:
    build:
      context: ..
      dockerfile: bot/Dockerfile
    container_name: ccchat-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
