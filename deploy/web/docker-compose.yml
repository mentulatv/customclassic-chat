# The website on Tower: copy web/ to ./site (and the item names to ./site/api/names.json), then
#   docker compose up -d
services:
  ccc-web:
    image: nginx:1.27-alpine
    container_name: ccc-web
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      - ./site:/site:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
