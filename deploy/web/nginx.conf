# CustomClassic Chat's website (ccc.mentula.tv), behind the VPS's reverse proxy.
server {
    listen 80;
    root /site;
    index index.html;

    # cross-origin isolated: text recognition may use several threads when the graphics card can't
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;

    types { application/javascript js; text/css css; text/html html; image/svg+xml svg;
            application/octet-stream onnx; text/plain txt; application/json json; }
    gzip on;
    gzip_types application/javascript text/css application/json text/plain;

    location /models/ { add_header Cache-Control "public, max-age=604800"; add_header Cross-Origin-Opener-Policy "same-origin" always; add_header Cross-Origin-Embedder-Policy "credentialless" always; }
    location = /api/names { default_type application/json; try_files /api/names.json =404; }  # the app's watch list item names
    location / { add_header Cache-Control "no-cache"; add_header Cross-Origin-Opener-Policy "same-origin" always; add_header Cross-Origin-Embedder-Policy "credentialless" always; try_files $uri $uri/ =404; }
}
